name: sarvodaya_connect_mobile
description: "Sarvodaya Connect phone app for Society Officers, SPCs, DDMs, District Managers and HQ."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.6
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  http: ^1.5.0
  intl: any
  latlong2: ^0.10.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/sarvodaya_connect_logo.jpg
    - assets/branding/sarvodaya_connect_logo_white.png
    - assets/branding/sarvodaya_connect_wordmark.png
    - assets/sdg/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/sarvodaya_connect_logo.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/sarvodaya_connect_logo.jpg
  remove_alpha_ios: true
