name: sarvodaya_connect_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sarvodaya_connect_logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/sarvodaya_connect_logo.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/sarvodaya_connect_logo.jpg
  remove_alpha_ios: true
