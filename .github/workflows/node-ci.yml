name: Node.js CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "packages/api-contracts/**"
      - ".nvmrc"
      - ".github/workflows/node-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "packages/api-contracts/**"
      - ".nvmrc"
      - ".github/workflows/node-ci.yml"

permissions:
  contents: read

jobs:
  api-contracts:
    name: Shared API contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/api-contracts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/api-contracts/package-lock.json

      - name: Install contract dependencies
        run: npm ci

      - name: Type-check shared contracts
        run: npm run check

      - name: Test shared contracts
        run: npm test

      - name: Build shared contracts
        run: npm run build

      - name: Audit contract production dependencies
        run: npm audit --omit=dev

  api:
    name: NestJS API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway PostgreSQL for the Prisma migration and database tests.
    # The credentials only exist inside this short-lived CI container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sarvodaya_ci
          POSTGRES_PASSWORD: ci_only_not_secret
          POSTGRES_DB: sarvodaya_connect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarvodaya_ci -d sarvodaya_connect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sarvodaya_ci:ci_only_not_secret@localhost:5432/sarvodaya_connect_ci

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint

      - name: Run API unit tests
        run: npm test

      - name: Run API end-to-end tests
        run: npm run test:e2e

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Check migrations match the Prisma schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Run database tests
        run: npm run test:db

      - name: Build API
        run: npm run build

      - name: Audit API production dependencies
        run: npm audit --omit=dev

  dashboard:
    name: Next.js dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Test dashboard
        run: npm test

      - name: Build dashboard
        run: npm run build

      - name: Audit dashboard production dependencies
        run: npm audit --omit=dev
