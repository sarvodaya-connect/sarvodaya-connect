name: iOS internal release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to testers (e.g. 0.1.1)'
        required: true
        type: string
      build_number:
        description: 'New integer higher than previous iOS uploads (e.g. 2)'
        required: true
        type: string
      release_notes:
        description: 'What to Test notes to retain with the build (1-500 characters)'
        required: true
        type: string
      publish:
        description: 'Upload to internal TestFlight (off = signed artifact only)'
        default: false
        type: boolean
      translation_review:
        description: 'Expose unreviewed Sinhala/Tamil for internal tester review'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'sarvodaya-connect/sarvodaya-connect'
    name: Build and optionally upload internal iOS release
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight-internal
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      TRANSLATION_REVIEW: ${{ inputs.translation_review }}
    steps:
      - name: Check out exact selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare validated TEST build settings
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: python3 scripts/ios/prepare_release.py build

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false

      - name: Restore dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Analyze mobile code and run tests
        working-directory: apps/mobile
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Generate Flutter release configuration
        working-directory: apps/mobile
        run: >-
          flutter build ios --release --config-only --no-codesign --no-pub
          --build-name="$VERSION_NAME"
          --build-number="$BUILD_NUMBER"
          --dart-define-from-file="$RUNNER_TEMP/sarvodaya-ios-release/defines.json"

      - name: Install the Apple Distribution identity in a temporary keychain
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          : "${APPLE_DISTRIBUTION_P12_PASSWORD:?Configure APPLE_DISTRIBUTION_P12_PASSWORD}"
          python3 scripts/ios/prepare_release.py signing
          release="$RUNNER_TEMP/sarvodaya-ios-release"
          keychain="$release/signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$release/distribution.p12" -f pkcs12 -k "$keychain" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution:'
          rm "$release/distribution.p12"

      - name: Archive and export signed IPA
        working-directory: apps/mobile
        run: |
          release="$RUNNER_TEMP/sarvodaya-ios-release"
          xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$release/Runner.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$release/Runner.xcarchive" \
            -exportOptionsPlist "$release/export.plist" -exportPath "$release/export"

      - name: Verify signed IPA and record its checksum
        run: |
          release="$RUNNER_TEMP/sarvodaya-ios-release"
          set -- "$release"/export/*.ipa
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo 'Expected exactly one exported IPA.'
            exit 1
          fi
          ditto -x -k "$1" "$release/verify"
          app="$release/verify/Payload/Runner.app"
          codesign --verify --deep --strict "$app"
          plist="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = 'org.sarvodayaconnect.sarvodayaConnectMobile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
          checksum=$(shasum -a 256 "$1" | cut -d ' ' -f 1)
          printf 'Built **%s (%s)** from `%s`.\n\nIPA SHA-256: `%s`\n\n' \
            "$VERSION_NAME" "$BUILD_NUMBER" "$GITHUB_SHA" "$checksum" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain IPA and What to Test notes for seven days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarvodaya-ios-${{ inputs.version_name }}-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/sarvodaya-ios-release/export/*.ipa
            ${{ runner.temp }}/sarvodaya-ios-release/What to Test.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload to App Store Connect for internal TestFlight only
        if: inputs.publish
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          : "${APP_STORE_CONNECT_KEY_ID:?Configure APP_STORE_CONNECT_KEY_ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Configure APP_STORE_CONNECT_ISSUER_ID}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Configure APP_STORE_CONNECT_PRIVATE_KEY}"
          release="$RUNNER_TEMP/sarvodaya-ios-release"
          umask 077
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$release/upload.p8"
          unset APP_STORE_CONNECT_PRIVATE_KEY
          xcodebuild -exportArchive -archivePath "$release/Runner.xcarchive" \
            -exportOptionsPlist "$release/upload.plist" -exportPath "$release/upload" \
            -allowProvisioningUpdates -authenticationKeyPath "$release/upload.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'Upload accepted. Check TestFlight for Apple processing and tester availability.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          release="$RUNNER_TEMP/sarvodaya-ios-release"
          if [ -f "$release/profile-uuid" ]; then
            uuid=$(cat "$release/profile-uuid")
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          fi
          if [ -f "$release/signing.keychain-db" ]; then
            security delete-keychain "$release/signing.keychain-db"
          fi
          rm -rf "$release"
