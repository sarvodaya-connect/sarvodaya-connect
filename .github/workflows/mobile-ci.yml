name: Flutter CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/play-internal-release.yml"
      - "scripts/play/**"

  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/play-internal-release.yml"
      - "scripts/play/**"

permissions:
  contents: read

jobs:
  mobile:
    name: Flutter mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        # Pinned to the reviewed commit the Android release workflow uses (#184).
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      # Exactly the versions in pubspec.lock; fails instead of resolving new ones (#184).
      - name: Restore Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test