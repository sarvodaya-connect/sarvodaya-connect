name: Flutter CI

on:
  # Run by ci.yml, which picks the checks a change needs and reports "CI passed".
  workflow_call:

permissions:
  contents: read

jobs:
  mobile:
    name: Flutter mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # Issue #161: the release notes the workflows embed for What's new.
      - name: Check release metadata scripts
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_*.py'