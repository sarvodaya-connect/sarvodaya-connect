# Version updates, weekly and grouped to keep the number of PRs small.
# Security updates are a repository setting and open PRs as soon as an
# advisory is published, outside this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /apps/api
      - /apps/dashboard
      - /apps/landing
      - /packages/api-contracts
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major upgrades are done by hand, one at a time, so Dependabot
      # only proposes minor and patch updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on 24.x: the project runs on Node 24 (.nvmrc and
      # the Lambda runtime).
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    labels: [dependencies, mobile]
    groups:
      pub-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major upgrades are done by hand, one at a time.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Colombo
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      # All action bumps, majors included, arrive as one PR. Updates whose
      # type is not listed here would get a PR of their own.
      actions:
        patterns: ["*"]
        update-types: [major, minor, patch]
