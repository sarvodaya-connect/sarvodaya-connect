AWSTemplateFormatVersion: '2010-09-09'
Description: Sarvodaya Connect TEST encrypted parameter bootstrap; render inline code before deployment
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: Existing signed-in account ID checked before deployment, not a new account
Rules:
  ExistingAccountOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', !Ref ExpectedAccountId]
        AssertDescription: Deploy into the existing account you reviewed
  SingaporeOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-southeast-1]
        AssertDescription: Deploy this TEST foundation in Singapore only
Resources:
  ParameterLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sarvodaya-connect-test-parameters
      RetentionInDays: 14
  ParameterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sarvodaya-connect-test-parameters
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: PrepareOnlyTestParameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:ListTagsForResource, ssm:PutParameter, ssm:AddTagsToResource]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sarvodaya-connect/test/database-master-password
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sarvodaya-connect/test/nic-encryption-key
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sarvodaya-connect-test-parameters:*
  ParameterFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParameterLogs
    Properties:
      FunctionName: sarvodaya-connect-test-parameters
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 60
      Handler: index.handler
      Role: !GetAtt ParameterRole.Arn
      Code:
        ZipFile: __PARAMETER_CODE__
  SecureParameters:
    Type: Custom::SarvodayaTestParameters
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !GetAtt ParameterFunction.Arn
      Prefix: /sarvodaya-connect/test
      ServiceTimeout: 120
Outputs:
  ConfigurationNamespace:
    Description: Non-secret namespace; consuming foundation prevents accidental bootstrap deletion
    Value: /sarvodaya-connect/test
    Export:
      Name: !Sub '${AWS::StackName}-ConfigurationNamespace'
