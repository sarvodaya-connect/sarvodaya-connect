AWSTemplateFormatVersion: '2010-09-09'
Description: Sarvodaya Connect isolated foundation in Singapore
Parameters:
  Stage:
    Type: String
    AllowedValues: [test, production]
    Default: test
  ExpectedAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: AWS account ID confirmed by the operator before deployment
  NatImage:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  DashboardOrigin:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[a-zA-Z0-9.-]+(,https://[a-zA-Z0-9.-]+)*$'
    Description: Dashboard HTTPS origins for browser signed uploads, comma-separated (for example the custom domain and the Amplify default during a switchover); blank until Amplify provides one
Mappings:
  NetworkRanges:
    test:
      Vpc: 10.77.0.0/16
      Public: 10.77.0.0/24
      PrivateA: 10.77.10.0/24
      PrivateB: 10.77.11.0/24
    production:
      Vpc: 10.78.0.0/16
      Public: 10.78.0.0/24
      PrivateA: 10.78.10.0/24
      PrivateB: 10.78.11.0/24
Rules:
  ExistingAccountOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', !Ref ExpectedAccountId]
        AssertDescription: Deploy into the existing account you reviewed
  SingaporeOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-southeast-1]
        AssertDescription: Deploy the foundation in Singapore only
  ProductionStackName:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref 'AWS::StackName', sarvodaya-connect-production-foundation]
            - !Equals [!Ref Stage, production]
          - !And
            - !Not [!Equals [!Ref 'AWS::StackName', sarvodaya-connect-production-foundation]]
            - !Equals [!Ref Stage, test]
        AssertDescription: Production stage and production stack name must be selected together
Conditions:
  IsTest: !Equals [!Ref Stage, test]
  IsProduction: !Equals [!Ref Stage, production]
  HasDashboardOrigin: !Not [!Equals [!Ref DashboardOrigin, '']]
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [NetworkRanges, !Ref Stage, Vpc]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub 'sarvodaya-connect-${Stage}'}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Network
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: !FindInMap [NetworkRanges, !Ref Stage, Public]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub 'sarvodaya-connect-${Stage}-public-a'}]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: !FindInMap [NetworkRanges, !Ref Stage, PrivateA]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub 'sarvodaya-connect-${Stage}-private-a'}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      CidrBlock: !FindInMap [NetworkRanges, !Ref Stage, PrivateB]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub 'sarvodaya-connect-${Stage}-private-b'}]
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Network}
  PublicAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRoutes}
  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Network}
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRoutes}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRoutes}
  NatSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [IsTest, 'Test NAT only; HTTP/HTTPS from private network; no SSH', 'NAT only; HTTP/HTTPS from private network; no SSH']
      VpcId: !Ref Network
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !FindInMap [NetworkRanges, !Ref Stage, Vpc]}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !FindInMap [NetworkRanges, !Ref Stage, Vpc]}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0}
  NatInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal: {Count: 1, Timeout: PT10M}
    DependsOn: PublicInternetRoute
    Properties:
      InstanceType: t4g.nano
      ImageId: !Ref NatImage
      SourceDestCheck: false
      CreditSpecification: {CPUCredits: standard}
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet
          GroupSet: [!Ref NatSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 8, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub 'sarvodaya-connect-${Stage}-nat'}]
      UserData:
        Fn::Base64: !Sub
          - |
              #!/bin/bash
              set -euo pipefail
              trap '/opt/aws/bin/cfn-signal -e $? --stack "${AWS::StackName}" --resource NatInstance --region "${AWS::Region}"' EXIT
              # AL2023's RAM-backed zram is insufficient for dnf on 512 MB nano.
              # Use 2 GiB on the existing encrypted root disk before any package work.
              dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
              dnf --setopt=install_weak_deps=False install -y aws-cfn-bootstrap iptables-services
              systemctl enable --now iptables
              iptables -F FORWARD
              echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-sarvodaya-nat.conf
              sysctl --system
              iface=$(ip route show default | awk '{print $5; exit}')
              iptables -t nat -A POSTROUTING -o "$iface" -j MASQUERADE
              iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
              iptables -A FORWARD -s ${VpcCidr} -j ACCEPT
              iptables -P FORWARD DROP
              service iptables save
              systemctl enable iptables
          - VpcCidr: !FindInMap [NetworkRanges, !Ref Stage, Vpc]
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref NatInstance
  PrivateInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: NatAddress
    Properties:
      RouteTableId: !Ref PrivateRoutes
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NatInstance
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Network
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds: [!Ref PrivateRoutes]
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [IsTest, 'Test API and temporary migration shell; no inbound access', 'API and temporary migration shell; no inbound access']
      VpcId: !Ref Network
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !If [IsTest, 'Test PostgreSQL; inbound only from test application group', 'PostgreSQL; inbound only from the application group']
      VpcId: !Ref Network
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !FindInMap [NetworkRanges, !Ref Stage, Vpc]}
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      SourceSecurityGroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !If [IsTest, 'Private subnets for Sarvodaya Connect TEST only', 'Private subnets for Sarvodaya Connect production']
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    # Do not start the costly database path before NAT bootstrap has signalled.
    DependsOn: NatInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub sarvodaya-connect-${Stage}-db
      DBName: !Sub sarvodaya_${Stage}
      Engine: postgres
      EngineVersion: '17.11'
      EngineLifecycleSupport: open-source-rds-extended-support-disabled
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub sc_${Stage}_admin
      ManageMasterUserPassword: !If [IsProduction, true, !Ref 'AWS::NoValue']
      MasterUserPassword: !If
        - IsTest
        - !Sub
          - '{{resolve:ssm-secure:${Namespace}/database-master-password:1}}'
          - Namespace: !ImportValue sarvodaya-connect-test-bootstrap-ConfigurationNamespace
        - !Ref 'AWS::NoValue'
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      Port: '5432'
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: false
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: false
      MonitoringInterval: 0
      EnablePerformanceInsights: false
      CopyTagsToSnapshot: true
      Tags: [{Key: Name, Value: !Sub 'sarvodaya-connect-${Stage}-db'}]
  Documents:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sarvodaya-connect-${Stage}-documents-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      # Downloads use pre-signed links, so the API only records that a link was
      # issued. S3 access logs record each request actually made to the bucket.
      LoggingConfiguration: {DestinationBucketName: !Ref DocumentAccessLogs, LogFilePrefix: documents/}
      CorsConfiguration: !If
        - HasDashboardOrigin
        - CorsRules:
            - AllowedOrigins: !Split [',', !Ref DashboardOrigin]
              AllowedMethods: [GET, PUT, HEAD]
              AllowedHeaders: [content-type, x-amz-checksum-sha256]
              ExposedHeaders: [ETag]
              MaxAge: 300
        - !Ref AWS::NoValue
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - !If
            - IsTest
            - Id: RemoveOldTestVersions
              Status: Enabled
              NoncurrentVersionExpiration: {NoncurrentDays: 30}
              AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
            - Id: AbortIncompleteDocumentUploads
              Status: Enabled
              AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  DocumentsHttps:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Documents
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Documents.Arn, !Sub '${Documents.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  DocumentAccessLogs:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sarvodaya-connect-${Stage}-access-logs-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      # S3 server access logs can be delivered only to SSE-S3 encrypted buckets.
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      # Each log file has a unique key, so versioning stores nothing extra
      # unless a log is deleted or overwritten; that copy is kept for 30 days.
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  DocumentAccessLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentAccessLogs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt DocumentAccessLogs.Arn, !Sub '${DocumentAccessLogs.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          # Only S3 logging, for the documents bucket in this account, may write.
          - Effect: Allow
            Principal: {Service: logging.s3.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${DocumentAccessLogs.Arn}/documents/*'
            Condition:
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:s3:::sarvodaya-connect-${Stage}-documents-${AWS::AccountId}-${AWS::Region}'}
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sarvodaya-connect-${Stage}-build-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
  ArtifactsHttps:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  UserPool:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub sarvodaya-connect-${Stage}
      UserPoolTier: ESSENTIALS
      UsernameConfiguration: {CaseSensitive: false}
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      MfaConfiguration: 'OFF'
      DeletionProtection: ACTIVE
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireNumbers: true
          RequireLowercase: false
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 3
      UserPoolTags: {Project: SarvodayaConnect, Environment: !Ref Stage}
  DashboardClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub sarvodaya-connect-${Stage}-dashboard
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 8
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: hours}
  MobileClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub sarvodaya-connect-${Stage}-mobile
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 8
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: hours}
Outputs:
  VpcId: {Value: !Ref Network}
  NatInstanceId: {Value: !Ref NatInstance}
  PrivateSubnetId: {Value: !Ref PrivateSubnetA}
  SecondPrivateSubnetId: {Value: !Ref PrivateSubnetB}
  ApplicationSecurityGroupId: {Value: !Ref AppSecurityGroup}
  DatabaseHost: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseIdentifier: {Value: !Ref Database}
  DatabaseAdminSecretArn:
    Condition: IsProduction
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  DocumentsBucketName: {Value: !Ref Documents}
  DeploymentBucketName: {Value: !Ref Artifacts}
  DocumentAccessLogsBucketName: {Value: !Ref DocumentAccessLogs}
  CognitoUserPoolId: {Value: !Ref UserPool}
  DashboardClientId: {Value: !Ref DashboardClient}
  MobileClientId: {Value: !Ref MobileClient}
