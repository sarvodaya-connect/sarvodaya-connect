# V5 PR 10: the API on AWS Lambda behind an API Gateway HTTP API (AWS SAM).
#
# This template describes the agreed shape; nothing in the repository deploys
# it, and it creates no resources until an authorised person runs
# `sam deploy` against Sarvodaya's account. Build the code first:
#
#   cd apps/api && npm run package:lambda      # -> apps/api/.lambda/package
#   sam validate --lint -t infrastructure/aws/template.yaml
#   sam local start-api -t infrastructure/aws/template.yaml   # optional local check
#
# The VPC, subnets, database, Cognito user pool and documents bucket are
# provisioned separately. Test uses a NAT instance, direct private RDS and SSM
# SecureStrings; existing stages retain their Secrets Manager configuration.
# See docs/aws-configuration.md for every setting and the deployment steps.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sarvodaya Connect API (NestJS on Lambda behind API Gateway)

Parameters:
  Stage:
    Type: String
    AllowedValues: [test, staging, production]
  DocumentsBucketName:
    Type: String
    Description: Private S3 bucket for society documents and incident photos (blocks public access)
  CognitoUserPoolId:
    Type: String
    Description: The Sarvodaya user pool, <region>_<id>; the token issuer is https://cognito-idp.<region>.amazonaws.com/<pool id>
    AllowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]_[A-Za-z0-9]+$'
  CognitoClientIds:
    Type: String
    Description: Comma-separated public app client ids (dashboard, phone app); no client secret. Access tokens must carry one of these as client_id
  DatabaseSecretArn:
    Type: String
    Default: ''
    Description: Staging/production only. Secrets Manager secret containing DATABASE_URL; unused for test
  NicKeySecretArn:
    Type: String
    Default: ''
    Description: Staging/production only. Secret containing NIC_ENCRYPTION_KEY; unused for test
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "Test: private RDS on 5432 and outbound HTTPS through the approved NAT instance; S3 gateway endpoint. Other stages use their reviewed network"
  SarvoAiEnabled:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
  SarvoAiModelId:
    Type: String
    Default: global.anthropic.claude-haiku-5-5
  SarvoAiRegion:
    Type: String
    Default: ap-southeast-1
  SarvoAiMonthlyLimitUsd:
    Type: String
    AllowedPattern: '^[0-9]{1,6}(\.[0-9]{1,6})?$'
    Default: '20'
    Description: Application spending limit for SarvoAI per UTC month. Not an AWS billing cap.
  SarvoAiPricingApproval:
    Type: String
    Default: ''
    Description: Reviewed Bedrock prices for this model and Region as one line of JSON (docs/sarvoai-aws-setup.md). Empty, invalid or expired refuses every model call.

Rules:
  ExistingStageSecrets:
    RuleCondition: !Not [!Equals [!Ref Stage, test]]
    Assertions:
      - Assert: !Not [!Equals [!Ref DatabaseSecretArn, '']]
        AssertDescription: Staging and production require the database secret ARN
      - Assert: !Not [!Equals [!Ref NicKeySecretArn, '']]
        AssertDescription: Staging and production require the NIC key secret ARN
  TestAiDisabled:
    RuleCondition: !Equals [!Ref Stage, test]
    Assertions:
      - Assert: !Equals [!Ref SarvoAiEnabled, 'false']
        AssertDescription: Keep test SarvoAI disabled until a reviewed application monthly spending cap is implemented
  AiPricingApproved:
    Assertions:
      - Assert: !Or [!Equals [!Ref SarvoAiEnabled, 'false'], !Not [!Equals [!Ref SarvoAiPricingApproval, '']]]
        AssertDescription: SarvoAI cannot be enabled without a reviewed pricing approval

Conditions:
  IsTest: !Equals [!Ref Stage, test]
  SarvoAiOn: !Equals [!Ref SarvoAiEnabled, 'true']

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 1024
    # API Gateway HTTP APIs wait at most 30 seconds.
    Timeout: 29
    Tracing: Active

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sarvodaya-api-${Stage}
      CodeUri: ../../apps/api/.lambda/package
      Handler: lambda.handler
      # Test capacity budget: docs/aws-test-environment.md. Raise this only with the
      # database role limit in infrastructure/aws/test/runtime-database-role.sql.
      ReservedConcurrentExecutions: !If [IsTest, 4, !Ref AWS::NoValue]
      Tracing: !If [IsTest, PassThrough, Active]
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      Environment:
        Variables:
          NODE_ENV: production
          # Node reads extra trust anchors at process startup, before SSM loading.
          NODE_EXTRA_CA_CERTS: !If [IsTest, /var/task/certificates/rds-ap-southeast-1.pem, !Ref AWS::NoValue]
          AUTH_PROVIDER: cognito
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_REGION: !Select [0, !Split ['_', !Ref CognitoUserPoolId]]
          COGNITO_CLIENT_ID: !Ref CognitoClientIds
          COGNITO_TOKEN_USE: access
          # Test loads encrypted SSM parameters at cold start. Other stages
          # retain deployment-time Secrets Manager references; no values in Git.
          DATABASE_URL: !If [IsTest, !Ref AWS::NoValue, !Sub '{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString}}']
          NIC_ENCRYPTION_KEY: !If [IsTest, !Ref AWS::NoValue, !Sub '{{resolve:secretsmanager:${NicKeySecretArn}:SecretString}}']
          CONFIG_PARAMETER_PREFIX: !If [IsTest, /sarvodaya-connect/test, !Ref AWS::NoValue]
          # Test: one connection per active instance, direct to private RDS.
          DATABASE_CONNECTION_LIMIT: !If [IsTest, '1', '2']
          STORAGE_DRIVER: s3
          S3_BUCKET: !Ref DocumentsBucketName
          S3_REGION: !Ref AWS::Region
          STORAGE_URL_TTL_SECONDS: '900'
          DOCUMENT_MAX_UPLOAD_BYTES: '10000000'
          DISTRICT_ACCESS_MAX_DAYS: '14'
          SARVOAI_ENABLED: !Ref SarvoAiEnabled
          SARVOAI_FICTIONAL_ONLY: !If [IsTest, 'true', 'false']
          SARVOAI_MODEL_ID: !Ref SarvoAiModelId
          SARVOAI_AWS_REGION: !Ref SarvoAiRegion
          SARVOAI_MONTHLY_LIMIT_USD: !Ref SarvoAiMonthlyLimitUsd
          SARVOAI_PRICING_APPROVAL: !Ref SarvoAiPricingApproval
          LOG_FORMAT: json
      Policies:
        - !If
          - IsTest
          - Version: '2012-10-17'
            Statement:
              - Sid: ReadTestRuntimeParameters
                Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sarvodaya-connect/test/database-url
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sarvodaya-connect/test/nic-encryption-key
          - !Ref AWS::NoValue
        - Version: '2012-10-17'
          Statement:
            # Pre-signed upload, download and the HEAD check after an upload. Nothing else in the bucket.
            - Sid: DocumentsReadWrite
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}/societies/*
                - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}/incidents/*
            # HQ account management (D16): create a user, set HQ's permanent password,
            # enable or disable it and end its sessions. One user pool only; no delete,
            # no attribute or pool changes, no listing of users.
            - Sid: CognitoAccountAdmin
              Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminUserGlobalSignOut
              Resource: !Sub
                - arn:${AWS::Partition}:cognito-idp:${PoolRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
                - PoolRegion: !Select [0, !Split ['_', !Ref CognitoUserPoolId]]
        - !If
          - SarvoAiOn
          # The three statements AWS requires for a global inference profile; see sarvoai-bedrock-policy.json.
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${SarvoAiRegion}:${AWS::AccountId}:inference-profile/${SarvoAiModelId}
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${SarvoAiRegion}::foundation-model/anthropic.claude-haiku-5-5
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${SarvoAiRegion}:${AWS::AccountId}:inference-profile/${SarvoAiModelId}
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.claude-haiku-5-5
                Condition:
                  StringEquals:
                    aws:RequestedRegion: unspecified
                    bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${SarvoAiRegion}:${AWS::AccountId}:inference-profile/${SarvoAiModelId}
          - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # The dashboard calls the API from its server (server components and
      # actions) and the phone app is native, so browsers never call the API
      # directly: no CORS rule is needed here. Uploads use the bucket's CORS.
      DefaultRouteSettings:
        ThrottlingBurstLimit: !If [IsTest, 20, 100]
        ThrottlingRateLimit: !If [IsTest, 10, 50]
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        # Request id, route and status only: no headers, tokens or bodies.
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/sarvodaya-api-${Stage}
      RetentionInDays: !If [IsTest, 14, 90]

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sarvodaya-api-${Stage}
      RetentionInDays: !If [IsTest, 14, 90]

Outputs:
  ApiBaseUrl:
    Description: Set as API_BASE_URL on Amplify and API_BASE_URL in the phone build (append /api/v1)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/v1
