# Disposable local/CI services only. Never point this at shared data.
# Digests pin the multi-platform images used for the packaged Lambda smoke run.
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: aws_smoke
      POSTGRES_PASSWORD: ${SMOKE_DB_PASSWORD:?temporary password required}
      POSTGRES_DB: aws_smoke
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aws_smoke -d aws_smoke"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?temporary username required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?temporary password required}
    ports:
      - "127.0.0.1::9000"

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:2fc4412391f1ce7372db8dd8bee17b38d76f7bb898bac195915bfe6979aa5784
    profiles: [init]
    environment:
      MC_HOST_smoke: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "smoke/aws-smoke-documents"]
